[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
# core::fmt drags in far more than the kernel calls; whole-program LTO in
# one codegen unit lets the linker-time optimiser prove most of it dead.
lto = true
codegen-units = 1
